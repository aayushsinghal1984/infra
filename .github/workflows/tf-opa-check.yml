name: 'Terraform Engine terra Template'

on:
  workflow_call:
    inputs:
      target_env:
        required: true
        type: string
        description: 'Target Environment (sit, uat, production)'
      working_dir:          
        required: true
        type: string
      is_apply:
        required: true
        type: boolean
        description: 'Set to true to run ONLY terraform apply from artifact'

env:  
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true
  TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

jobs:
  core-engine:
    name: 'Execute TF Ops'
    runs-on: windows-latest
    environment: ${{ inputs.target_env }}
    
    permissions:
      id-token: write
      contents: write

    steps:
      - name: 'Checkout Source Code'
        uses: actions/checkout@v4

      - name: Install jq
        shell: pwsh
        run: choco install jq -y

      - name: 'Download Terraform Plan Artifact'
        if: ${{ inputs.is_apply == true }}
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: ${{ github.workspace }}/${{ inputs.working_dir }}
          
      - name: 'Setup Open Policy Agent (OPA)'
        if: ${{ inputs.is_apply == false }}
        uses: open-policy-agent/setup-opa@v2
        with:
          version: 'v0.61.0' 
      - name: 'Run OPA Policy Check'
        if: ${{ inputs.is_apply == false }}
        shell: pwsh
        run: |
          $targetDir = "${{ inputs.working_dir }}"
          if ([string]::IsNullOrWhiteSpace($targetDir)) { $targetDir = "." }
          $jsonPath = Join-Path $env:GITHUB_WORKSPACE "$targetDir/tfplan.json"
          $opaResult = Join-Path $env:GITHUB_WORKSPACE "$targetDir/opa_result.json"
          
          $moduleName = Split-Path $targetDir -Leaf
          $policyBundle = Join-Path $env:GITHUB_WORKSPACE "policies" $moduleName
          
          if (Test-Path $policyBundle) {
              "### Policy Bundle Used" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              "$policyBundle" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              
              # OPA Eval with Call Operator (&)
              & opa eval --format json --bundle "$policyBundle" "data" --input "$jsonPath" | Out-File -FilePath "$opaResult" -Encoding utf8
              Write-Host "Checking OPA result file..."
              Get-Content $opaResult
              # Rule names with Call Operator (&)
              $rulesChecked = & jq -r '.result[0].expressions[0].value | keys[]' "$opaResult"
              
              " Rules Evaluated" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              if ($rulesChecked) {
                  $rulesChecked | ForEach-Object { "- $_" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
              }
              
              # Violation Check with Call Operator (&)
              $violationCount = & jq -r '.result[0].expressions[0].value | .. | .deny? | select(. != null) | length' "$opaResult"
              if ([string]::IsNullOrWhiteSpace($violationCount)) { $violationCount = 0 }
              
              if ([int]$violationCount -gt 0) {
              " OPA Status:  FAIL - $violationCount Violations Found" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
                  Write-Error "OPA Policy Violations Found!"
                  exit 1
              } else {
              " OPA Status: PASS - Compliant" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              }
          } else {
              " OPA Status: SKIPPED - No Policy Bundle Found at $policyBundle" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }


    
        
